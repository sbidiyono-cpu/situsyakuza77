<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAKUZA77 - Official Portal</title>
    <!-- SEO & Social Media Preview -->
    <meta property="og:title" content="YAKUZA77 - Official Portal">

    <meta property="og:image" content="image_d424e2.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #060a12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #0d1527 0%, #050811 100%);
            border: 2px solid #d4af37;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
            padding: 24px;
            text-align: center;
        }

        .poster-box {
            width: 100%;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #d4af37;
            margin-bottom: 20px;
            background: #000;
        }

        .poster-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        h1 {
            color: #d4af37;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .sub-title {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .btn-daftar {
            background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
            color: #050811;
        }

        .btn-daftar:hover {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.4);
        }

        .btn-login {
            background: rgba(13, 21, 39, 0.8);
            border: 2px solid #d4af37;
            color: #d4af37;
        }

        .btn-login:hover {
            background: #d4af37;
            color: #050811;
            transform: translateY(-2px);
        }

        .btn-wa {
            background: #25d366;
            color: #ffffff;
        }

        .btn-wa:hover {
            background: #1eb857;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);
        }

        footer {
            margin-top: 20px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Poster Web YAKUZA77 -->
        <div class="poster-box">
            <img src="image_d424e2.jpg" alt="Poster promosi YAKUZA77" loading="eager">
        </div>

        <h1>YAKUZA77</h1>
        <p class="sub-title">Situs Resmi Terpercaya - Akses Cepat & Aman</p>

        <div class="btn-group">
            <!-- Link Pendaftaran -->
            <a href="https://ykuza77.com/luln" target="_blank" rel="noopener noreferrer" class="btn btn-daftar">
                <i class="fas fa-user-plus"></i> DAFTAR YAKUZA77
            </a>
            
            <!-- Link Login -->
            <a href="https://ykuza77.com/luln" target="_blank" rel="noopener noreferrer" class="btn btn-login">
                <i class="fas fa-sign-in-alt"></i> LOGIN YAKUZA77
            </a>
            
            <!-- Link WhatsApp Grup -->
            <a href="https://chat.whatsapp.com/JqeUCiR0D3s86f3Ek2PA8f?s=cl&p=i&mlu=4&ilr=4&iam=2" target="_blank" rel="noopener noreferrer" class="btn btn-wa">
                <i class="fab fa-whatsapp"></i> WHATSAPP GRUP
            </a>
        </div>

        <footer>
            &copy; 2026 YAKUZA77. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
